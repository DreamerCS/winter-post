name: Publish the winter postcard
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions: {}
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-latest
    permissions:
      packages: read
      contents: read
      pages: write
    steps:
      - name: Retrieve the sealed postcard
        env:
          READER_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/winter-post-site:latest"
          printf '%s' "$READER_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          docker pull "$image"
          container="$(docker create "$image" /unused)"
          trap 'docker rm "$container" >/dev/null' EXIT
          mkdir publication
          docker cp "$container:/site/." publication/
          test -s publication/card.bin
          test -s publication/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: publication
  deploy:
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deploy
